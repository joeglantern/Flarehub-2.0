# /etc/nginx/sites-available/flarehub
# After DNS propagates, run: sudo certbot --nginx -d flarehub.org -d www.flarehub.org -d app.flarehub.org -d api.flarehub.org
# Certbot will automatically add the SSL server blocks below.

# ── Redirect bare domain → www ───────────────────────────────────────────────
server {
    listen 80;
    server_name flarehub.org;
    return 301 https://www.flarehub.org$request_uri;
}

# ── Marketing / Landing page (www.flarehub.org) ──────────────────────────────
server {
    listen 80;
    server_name www.flarehub.org;

    root /var/www/flarehub/flarehub-marketing/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "same-origin" always;

    location ~ /\. { deny all; }
}

# ── Main app (app.flarehub.org) ──────────────────────────────────────────────
server {
    listen 80;
    server_name app.flarehub.org;

    root /var/www/flarehub/flarehub-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "same-origin" always;

    location ~ /\. { deny all; }
}

# ── API (api.flarehub.org) ───────────────────────────────────────────────────
server {
    listen 80;
    server_name api.flarehub.org;

    location / {
        proxy_pass         http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /ws {
        proxy_pass         http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    add_header X-Content-Type-Options "nosniff" always;

    location ~ /\. { deny all; }
}
