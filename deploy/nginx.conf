# Drop this file into /etc/nginx/sites-available/flarehub
# Then: sudo ln -s /etc/nginx/sites-available/flarehub /etc/nginx/sites-enabled/flarehub
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 156.67.25.84;

    # ── Frontend (React SPA) ─────────────────────────────────────────────────
    root /var/www/flarehub/flarehub-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively; HTML never
        location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── Backend API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── WebSocket ────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "same-origin"  always;

    # Block hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
    }
}
