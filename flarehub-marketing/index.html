    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@afosihub" />
    <meta name="twitter:title" content="Afosihub · Build something real" />
    <meta name="twitter:description" content="Afosihub connects Kenyan founders with mentors, capital, and community. Apply to our next cohort." />
    <meta name="twitter:image" content="https://afosihub.com/og.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js"></script>
    <style>
      #loader {
        position: fixed;
        inset: 0;
        background: #f7f6f3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 560ms cubic-bezier(.4,0,.2,1);
      }
      #loader.out { opacity: 0; pointer-events: none; }

      .ld-logo {
        width: 80px;
        height: 80px;
        border-radius: 22px;
        background: #1a1916;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 8px 32px rgba(26,25,22,.22);
        animation: ld-glow 2.2s ease-in-out infinite;
        margin-bottom: 20px;
      }
      .ld-dot {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #c4522a;
        border: 3px solid #f7f6f3;
      }
      .ld-name {
        font-family: 'Bricolage Grotesque', Georgia, sans-serif;
        font-weight: 800;
        font-size: 24px;
        color: #1a1916;
        letter-spacing: -0.03em;
        margin-bottom: 32px;
      }

      /* Lottie sits here — always visible */
      .ld-lottie-wrap {
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      /* CSS ring fallback — hidden once lottie-player element is present & playing */
      .ld-ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid #d0ecdb;
        border-top-color: #1d6f42;
        animation: ld-spin 800ms linear infinite;
        position: absolute;
      }

      @keyframes ld-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes ld-glow {
        0%,100% { box-shadow: 0 8px 32px rgba(26,25,22,.22), 0 0 0 0 rgba(29,111,66,0); }
        50%      { box-shadow: 0 8px 32px rgba(26,25,22,.22), 0 0 0 16px rgba(29,111,66,.08); }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="ld-logo">
        <svg viewBox="0 0 256 256" width="40" height="40" aria-hidden="true">
          <path d="M173.79,51.48a221.25,221.25,0,0,0-41.67-34.34,8,8,0,0,0-8.24,0A221.25,221.25,0,0,0,82.21,51.48C54.59,80.48,40,112.47,40,144a88,88,0,0,0,176,0C216,112.47,201.41,80.48,173.79,51.48ZM96,184c0-27.67,22.53-47.28,32-54.3,9.48,7,32,26.63,32,54.3a32,32,0,0,1-64,0Z" fill="white"/>
        </svg>
        <span class="ld-dot"></span>
      </div>
      <div class="ld-name">Afosihub</div>
      <div class="ld-lottie-wrap">
        <div class="ld-ring"></div>
        <lottie-player
          src="https://assets3.lottiefiles.com/packages/lf20_szlepvdh.json"
          background="transparent"
          speed="1"
          style="width:120px;height:120px;position:absolute;"
          loop
          autoplay
        ></lottie-player>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
